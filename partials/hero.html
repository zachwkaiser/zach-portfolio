<header id="hero" class="zk-hero">
        <canvas id="zk-hero-canvas" class="zk-hero-canvas" aria-hidden="true"></canvas>
        <div class="zk-hero-glow" aria-hidden="true"></div>
        <div class="zk-hero-inner">
          <p class="zk-hero-kicker zk-slide-in">
            <span class="zk-hero-dot" aria-hidden="true"></span>
            Software Engineering Student at UNCW
          </p>
          <h1 class="zk-hero-title zk-slide-in-1">Zach Kaiser</h1>
          <p class="zk-hero-typed zk-slide-in-2" aria-live="polite">
            <span id="zk-typed"></span><span id="zk-caret" class="zk-hero-caret" aria-hidden="true"></span>
          </p>
          <div class="zk-hero-actions zk-slide-in-3">
            <a href="#projects" class="zk-btn zk-btn--primary" data-scroll data-magnetic="0.3">View my work <span aria-hidden="true">&rarr;</span></a>
            <button type="button" class="zk-btn zk-btn--ghost" data-open-resume data-magnetic="0.25">Open resume</button>
          </div>
        </div>
      </header>
