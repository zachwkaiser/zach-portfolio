<template data-project-detail="coach11">

      <p class="zk-modal-meta">Jan 2026 — Present &nbsp;·&nbsp; Project Manager</p>
      <p class="zk-modal-summary">Gives UNCW Women’s Soccer coaches one place to upload match film and tag the moments that matter.</p>
