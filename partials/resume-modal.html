<div id="zk-resume" class="zk-modal zk-modal--resume" role="dialog" aria-modal="true" aria-labelledby="zk-resume-title" hidden>
      <div class="zk-modal-panel zk-modal-panel--resume" data-modal-panel>
        <div class="zk-resume-header">
          <h3 id="zk-resume-title" class="zk-resume-title">Zach Kaiser Resume</h3>
          <div class="zk-resume-header-actions">
            <a href="uploads/Resume.pdf" download class="zk-btn zk-btn--sm" data-magnetic="0.2">Download PDF &darr;</a>
            <button type="button" class="zk-modal-close" data-close-resume aria-label="Close resume">&times;</button>
          </div>
        </div>
        <div class="zk-resume-body">
          <object data="uploads/Resume.pdf" type="application/pdf">
            <div class="zk-resume-fallback">
              <span aria-hidden="true">&#128196;</span>
              <span>[ PLACEHOLDER: Resume.pdf ]</span>
              <span>Add <b>uploads/Resume.pdf</b> to show the live preview here.</span>
            </div>
          </object>
        </div>
      </div>
    </div>
